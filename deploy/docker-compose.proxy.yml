# Подключение панели к уже работающему на сервере обратному прокси.
#
# Нужен, когда 80 и 443 заняты чужим прокси в Docker: такой прокси живёт в
# своей сети и до хостового 127.0.0.1 не достучится. Этот файл кладёт панель
# в ту же сеть, и прокси обращается к ней по имени контейнера.
#
# Включается строкой EDGE_NETWORK в deploy/.env, например:
#   EDGE_NETWORK=n8n_default
# Имя сети смотреть в `docker network ls`.
#
# После этого в конфиге вашего прокси адрес панели - mp-reviews-panel-1:3000

services:
  panel:
    networks:
      - default
      - edge

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:?укажите EDGE_NETWORK в .env - имя сети вашего прокси}
