services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: reviews
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviews -d reviews']
      interval: 5s
      timeout: 5s
      retries: 20
    # Наружу порт не публикуется: база видна только сервисам этого compose.

  # Разовая задача, запускается вручную: docker compose run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reviews:${POSTGRES_PASSWORD}@db:5432/reviews?sslmode=disable

  panel:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reviews:${POSTGRES_PASSWORD}@db:5432/reviews?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET в .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?задайте ENCRYPTION_KEY в .env}
      N8N_API_KEY: ${N8N_API_KEY:?задайте N8N_API_KEY в .env}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - panel
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Домен для автоматического TLS. Без домена оставьте :80 - Caddy отдаст HTTP.
      PANEL_DOMAIN: ${PANEL_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
